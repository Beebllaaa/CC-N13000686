
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 5</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/p5.js"></script>
</head>

<body>

  <!-- Time information and slider -->
  <div class="time-panel">

    <!-- Seconds and minutes -->
    <div class="time-display">
      <div>
        second: <span id="secondValue">00</span>
      </div>

      <div>
        minute: <span id="minuteValue">00</span>
      </div>
    </div>

    <!-- Hour slider and label -->
    <div class="time-control">

      <input
        type="range"
        id="timeSlider"
        min="0"
        max="24"
        value="12"
        step="0.01"
      >

      <label for="timeSlider">
        hour: <span id="timeValue">12:00</span>
      </label>

    </div>

  </div>

  <!-- p5.js sketch -->
  <script src="sketch.js"></script>

</body>

</html>
